# Render Blueprint — Go server (built from the Dockerfile) + a PostgreSQL database.
# One account, nothing to paste: Render provisions the database and wires
# DATABASE_URL into the service automatically.
#
# Note: Render's free PostgreSQL expires ~30 days after it is created. That covers
# a demo/application window; for a permanent link, move the database to Neon
# (free, persistent) and set DATABASE_URL to its connection string instead.
databases:
  - name: practicum-db
    plan: free
    region: singapore

services:
  - type: web
    name: practicum-score-graphql
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: /server -seed   # -seed is idempotent: it only fills an empty database
    plan: free
    region: singapore
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: practicum-db
          property: connectionString
